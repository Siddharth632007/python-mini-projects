<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit Converter</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2a4a;--mu:#6b7280;--ac:#3b5bdb;--bd:#e2e6ef;--ok:#1e8e5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf7;--mu:#98a2b8;--ac:#6c88ff;--bd:#2b3246;--ok:#4cc38a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10131c;--card:#1a1f2d;--tx:#e8ecf7;--mu:#98a2b8;--ac:#6c88ff;--bd:#2b3246;--ok:#4cc38a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;margin:6px 0 2px}p.s{color:var(--mu);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
label{display:block;font-size:.8rem;color:var(--mu);margin:0 0 4px}
input,select{width:100%;font-size:1.05rem;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.r{display:flex;gap:8px;align-items:flex-end;margin-top:12px}.r>div{flex:1}
.sw{flex:0 0 46px;height:46px;border:1px solid var(--bd);background:var(--card);color:var(--ac);border-radius:10px;font-size:1.2rem;cursor:pointer}
.out{margin-top:16px;padding:16px;border-radius:12px;background:var(--bg);text-align:center}
.out b{display:block;font-size:1.7rem;word-break:break-all;color:var(--ac)}.out span{color:var(--mu);font-size:.9rem}
.rev{margin-top:10px;font-size:.9rem;color:var(--mu);text-align:center}
.note{font-size:.78rem;color:var(--mu);margin-top:10px}
h2{font-size:1rem;margin:22px 0 8px}ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
li span:last-child{color:var(--ok);font-weight:600;text-align:right}
.cl{background:none;border:0;color:var(--ac);cursor:pointer;font-size:.85rem;padding:6px 0}
</style></head><body><div class="w">
<h1>Unit Converter</h1><p class="s">Length · Weight · Temperature · Volume · Currency</p>
<div class="tabs" id="tabs"></div>
<div class="c">
<label for="v">Value</label><input id="v" type="number" inputmode="decimal" step="any" value="1">
<div class="r"><div><label for="f">From</label><select id="f"></select></div>
<button class="sw" id="sw" title="Swap units" aria-label="Swap units">⇄</button>
<div><label for="t">To</label><select id="t"></select></div></div>
<div class="out"><span id="ol"></span><b id="o">–</b></div>
<div class="rev" id="rev"></div>
<div class="note" id="note"></div></div>
<h2>Recent conversions</h2><ul id="h"></ul><button class="cl" id="cl">Clear history</button>
</div>
<script>
const U={
Length:{m:1,km:1000,cm:.01,mm:.001,mile:1609.344,yard:.9144,foot:.3048,inch:.0254},
Weight:{kg:1,g:.001,mg:1e-6,tonne:1000,pound:.45359237,ounce:.028349523125},
Temperature:{"°C":0,"°F":0,K:0},
Volume:{litre:1,ml:.001,"gallon (US)":3.785411784,quart:.946352946,cup:.2365882365,"fl oz":.0295735295625},
Currency:{USD:1,INR:1/88,EUR:1/.86,GBP:1/.75,JPY:1/150,AED:1/3.6725}};
let cat="Length",hist=[];
try{hist=JSON.parse(localStorage.getItem("uc_hist"))||[]}catch(e){}
const $=id=>document.getElementById(id);
function fmt(x){if(!isFinite(x))return"–";return Number(x.toPrecision(10)).toLocaleString(undefined,{maximumFractionDigits:6})}
function conv(v,a,b,c){
 if(c==="Temperature"){let k=a==="°C"?v+273.15:a==="°F"?(v-32)*5/9+273.15:v;
  return b==="°C"?k-273.15:b==="°F"?(k-273.15)*9/5+32:k}
 return v*U[c][a]/U[c][b]}
function tabs(){$("tabs").innerHTML="";Object.keys(U).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.className=k===cat?"on":"";b.onclick=()=>{cat=k;tabs();units();calc()};$("tabs").appendChild(b)})}
function units(){const ks=Object.keys(U[cat]);[$("f"),$("t")].forEach((s,i)=>{s.innerHTML=ks.map(k=>`<option>${k}</option>`).join("");s.selectedIndex=Math.min(i,ks.length-1)});
 $("note").textContent=cat==="Currency"?"Currency uses fixed reference rates (not live), so treat results as approximate.":""}
function calc(save){
 const v=parseFloat($("v").value),a=$("f").value,b=$("t").value;
 if(isNaN(v)){$("o").textContent="–";$("ol").textContent="Enter a number";$("rev").textContent="";return}
 const r=conv(v,a,b,cat);$("ol").textContent=`${fmt(v)} ${a} =`;$("o").textContent=`${fmt(r)} ${b}`;
 $("rev").textContent=`Reverse: ${fmt(r)} ${b} = ${fmt(conv(r,b,a,cat))} ${a}`;
 if(save===true){hist.unshift([cat,`${fmt(v)} ${a}`,`${fmt(r)} ${b}`]);hist=hist.slice(0,8);try{localStorage.setItem("uc_hist",JSON.stringify(hist))}catch(e){}drawH()}}
function drawH(){$("h").innerHTML=hist.length?hist.map(x=>`<li><span>${x[0]}: ${x[1]}</span><span>${x[2]}</span></li>`).join(""):"<li><span>Nothing yet</span></li>"}
["v","f","t"].forEach(i=>{$(i).addEventListener("input",()=>calc());$(i).addEventListener("change",()=>calc(true))});
$("sw").onclick=()=>{const a=$("f").selectedIndex;$("f").selectedIndex=$("t").selectedIndex;$("t").selectedIndex=a;calc(true)};
$("cl").onclick=()=>{hist=[];try{localStorage.removeItem("uc_hist")}catch(e){}drawH()};
tabs();units();calc();drawH();
</script></body></html>
